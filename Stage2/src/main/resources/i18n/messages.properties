calc.details=Calculation details
calc.details.dof.assumption=Distances are measured from the lens. Ignores diffraction and focus breathing; less accurate at macro distances.
calc.details.dof.coc=Sharpness depends on the selected CoC.
calc.details.dof.formula=Thin lens: H = f²/(N·c) + f; near = s(H − f)/(H + s − 2f); far = s(H − f)/(H − s), unbounded for s ≥ H.
calc.details.dof.symbols=f = focal length, N = f-number, c = CoC, s = focus distance, H = hyperfocal distance.
calc.details.exposure.assumption=Values are used as entered (f/5.6 is N = 5.6). No scene is metered.
calc.details.exposure.formula=EV = log2(N²/t) for f-number N and time t in seconds. EV100 = EV − log2(ISO/100).
calc.details.exposure.solved={0} solved: exact {1}, applied {2} ({3}).
calc.details.exposure.solvedExact={0} solved: {1}, with no standard-stop rounding.
calc.details.exposure.solvedLimit={0} solved: exact {1}; parameter limit reached, applied {2} ({3}).
calc.details.exposure.standard={0}: settings are generic standard stops, nearest by exposure error, used as marked (f/5.6 is N = 5.6). No scene is metered.
calc.details.exposure.target=Target EV100 {0}, actual {1}, deviation {2} (actual − target).
calc.details.figure=Figure: {0} m tall, to scale.
calc.details.fov.assumption=Ideal rectilinear lens focused at infinity; ignores distortion and focus breathing.
calc.details.fov.equivalent=35 mm equivalent: same diagonal angle on 36 × 24 mm. Results use the actual focal length.
calc.details.fov.formula=Angle = 2·atan(sensor dimension / (2 × focal length)). Scene size = distance × sensor dimension / focal length.
calc.details.motion.assumption=Assumes a stationary camera and lateral motion at constant speed. Excludes camera shake, panning and rolling shutter.
calc.details.motion.formula=Blur on sensor = focal length × speed × time / distance. Pixels = blur × image width / sensor width.
calc.details.motion.preview=The preview illustrates the blur length; it is not a simulated photograph.
calc.details.nd.assumption=Assumes ideal filter transmission; aperture and ISO unchanged.
calc.details.nd.formula=Adjusted time = base time × 2^stops. Factor = 2^stops = 10^density.
