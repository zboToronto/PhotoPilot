calc.assumption.battery=Shooting capacity estimate: ceil(planned shots / rated shots per full battery). Rating must match expected usage. Temperature, battery age, screen, autofocus and video affect capacity; no reserve included. mAh alone cannot determine shot count.
calc.assumption.exposure=EV = log2(N^2/t). EV100 = EV - log2(ISO/100); equal at ISO 100. This is not exposure compensation or a light measurement.
calc.assumption.focusFormula=Thin-lens theoretical approximation: H=f^2/(N*c)+f; h0=H-f; near=s*h0/(h0+s-f); far=s*h0/(h0-s+f). Far limit is Infinity at s >= H.
calc.assumption.focusLimits=Distances are measured from the lens principal plane. CoC is user-specified, not an intrinsic sensor constant. Ignores diffraction, pupil magnification and focus breathing; macro accuracy is limited.
calc.assumption.fov=Rectilinear lens at infinity focus: angle=2*atan(sensor dimension/(2*f)). Actual active sensor dimensions required; ignores cropping, distortion and focus breathing.
calc.assumption.nd=Adjusted shutter = original shutter x 2^stops. Aperture and ISO remain fixed; assumes ideal filter transmission. ND8 factor = 3 stops; OD 3.0 is about 9.966 stops.
calc.assumption.storage=Storage = shot count x average file size. Decimal MB=10^6 bytes; GB=10^9 bytes. Cards are rounded up; no filesystem overhead, redundancy or safety reserve included. Variable compression/video requires a measured average.
