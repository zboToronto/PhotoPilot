discover.intro=Not sure what to photograph? Describe where and when you can shoot; PhotoPilot asks Gemini for realistic activities and checks each one against your time, distance, gear and the verified conditions.
discover.inputs.title=Place, time and preferences
discover.inputs.privacy=A place name alone is enough. Coordinates (entered, found by name, or from this device only after you allow it) let PhotoPilot retrieve weather and sun data and compute straight-line distances. Coordinates go only to the weather, sun and place-lookup providers; Gemini receives the place name and time zone. Nothing is saved unless you save an idea.
discover.inputs.timeNotice=Times are local wall-clock times at the place. An end time earlier than the start continues past midnight. The longest activity is optional; without it an idea may use the whole period. Travel time is not estimated and is not included.
discover.inputs.distanceNotice=Maximum travel distance is compared with straight-line distance to the place PhotoPilot finds for an idea; road distance and travel time are not available.
