capability.section.QUALITY=Data quality
capability.section.ASSUMPTIONS=Assumptions and limitations
capability.technical.title=Complete technical report
capability.technical.description=Every section in plain text, including internal identifiers.
capability.assumption.recorded=Uses only recorded inventory specifications; nothing is looked up, estimated or generated, and missing values stay unknown.
capability.assumption.coverage=Focal coverage is the union of closed lens intervals across all mounts; a prime is one focal length; gaps exclude their endpoints; quantities do not add coverage.
capability.assumption.scale=Charts use a logarithmic focal-length axis, so equal ratios have equal widths.
capability.assumption.aperture=Apertures are recorded maximum f-numbers at the zoom endpoints; intermediate values, transmission, image quality and low-light performance are not inferred.
capability.assumption.mount=Mount labels are compared after case, spacing and hyphen normalization; explicit aliases (for example E on a Sony body and Sony E) count as equivalent. A match covers the mount label only; image circle, electronics, autofocus operation and adapters are not recorded.
capability.assumption.equivalent=35 mm-equivalent focal lengths compare the recorded sensor diagonal with 36 × 24 mm, only for mount-matched pairs, and assume the lens covers the whole sensor.
capability.assumption.quality=Data-quality findings list missing key fields, values outside plausible ranges and inconsistent records; optional fields are listed separately and are not errors.
capability.assumption.readOnly=The report is read-only: it never changes equipment, sessions, requirements, selections, milestones or plans, and makes no AI or network request.
