# F02 AI photography inspiration and activity recommendation
discover.ready=Find Something to Shoot is available: review your place, time, constraints and interests (manual, looked-up or consented device location), your confirmed F05 gear and optional F01 history; Gemini proposes activities and every idea is checked deterministically for time, straight-line distance, equipment, light and weather evidence before it is ranked. Ideas can continue in F03 as unconfirmed drafts, be saved to a session or be dismissed. No session is needed to ask.
discover.cli.summaryHelp=F02 / discover: Find Something to Shoot. AI activity ideas checked against your time, distance, gear and verified conditions; select, save or dismiss. Use discover help.
discover.cli.help=discover gear | discover place <name> | discover device consent|deny | discover run location=".." [place=<n>|device|latitude=.. longitude=..] date=YYYY-MM-DD from=HH:MM until=HH:MM [duration=<minutes>] distance=<km> [interests="a; b"] [avoid="c"] [portability=".."] [notes=".."] [history=yes|no] | discover again [key=value ...] | discover list | discover show <n> | discover select <n> <session-id>|new | discover save <n> <session-id>|new | discover dismiss <n> | discover saved <session-id>
discover.cli.placeHint=Use place=<number> with discover run to use a match. Its coordinates are an approximate gazetteer point.
discover.cli.deviceConsent=Device location needs explicit permission: run "discover device consent" (or "discover device deny"), then use device with discover run.
discover.cli.noLast=No earlier request in this session. Use discover run first.
