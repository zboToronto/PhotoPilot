capability.aperture.UNKNOWN_ZOOM=Recorded maximum: f/{0}; longest-end value: {1}. Constant/variable behavior is unknown.
capability.apertureNote=Smaller f-numbers represent larger relative apertures. Comparisons use recorded values only, not transmission, image quality, or equal-focal-length performance. No endpoint interpolation.
capability.noPairs=Both a camera body and a lens are needed for pair comparisons.
capability.mount.MATCH_RECORDED=Mount labels match; full compatibility is unknown.
capability.mount.DIFFERENT_RECORDED=Mount labels differ; direct compatibility is not established. No adapter assumed.
capability.mount.UNKNOWN=Mount information is unknown.
capability.compatibilityNote=Lens image-circle coverage, mount aliases and electronic constraints are not stored. No combination is certified fully compatible; adapter support and autofocus operation are unknown.
capability.equivalent=Conditional 36 × 24 mm diagonal-FOV equivalent: {0}
capability.equivalentNote=Equivalent values use the recorded sensor diagonal and matching mount labels, assuming full sensor coverage. They are geometric estimates, not compatibility guarantees. Actual focal length and f-number are unchanged.
