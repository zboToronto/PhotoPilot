review.cli.summaryHelp=F11 / review: import EXIF metadata, statistics, plan comparison and AI post-shoot review. Use review help.
review.cli.help=Post-shoot analysis and review (F11):\n  review show <session-id>                      readiness, saved statistics, plan comparison\n  review analyze <session-id> [--replace] <file|folder>...\n                                                read JPEG / ExifTool JSON locally, calculate and save statistics\n  review stats <session-id>                     saved statistics and evidence limits\n  review compare <session-id>                   plan versus recorded metadata\n  review generate <session-id>                  AI review draft (nothing saved)\n  review draft                                  show the pending draft\n  review save | review discard                  save the draft (Completed -> Reviewed) or discard it\n  review list <session-id>                      saved reviews\n  review open <session-id> [n]                  show a saved review\nQuote paths that contain spaces with double quotes.
