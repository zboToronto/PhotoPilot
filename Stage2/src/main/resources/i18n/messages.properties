capability.gapNote=Gap endpoints are excluded. No coverage is implied between prime lenses or outside the recorded range.
capability.poolNote=Coverage combines recorded lens entries across mounts. It does not establish a usable single-camera kit; duplicate quantity does not add focal coverage.
capability.largest=Largest recorded maximum aperture (smallest f-number): {0}
