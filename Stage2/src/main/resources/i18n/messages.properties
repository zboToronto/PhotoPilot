calc.assumption.coverage=Scene coverage = distance x sensor dimension / focal length (2 x distance x tan(angle/2)), an ideal pinhole projection measured from the lens. Real lenses frame slightly differently when focused close.
calc.assumption.motion=Simplified model: stationary camera, constant subject speed parallel to the sensor, subject distance much larger than the focal length. Blur on sensor = focal length x speed x exposure time / distance. No camera shake, panning, rotation, rolling shutter or stabilization.
calc.assumption.motionNoPixels=No pixel value: it needs the image width in pixels for this sensor width. A megapixel figure alone is not enough.
calc.assumption.motionClose=The subject is closer than 10 focal lengths, where this approximation underestimates magnification; treat the result as a rough guide.
calc.assumption.motionStill=Lateral speed is zero, so this model gives no subject-motion blur and motion sets no upper limit on the exposure time (shown as Infinity).
