calc.details.dof.assumption=距离自镜头量起。忽略衍射与呼吸效应；微距时精度有限。
calc.details.dof.coc=清晰度取决于所选弥散圆（CoC）。
calc.details.dof.formula=薄透镜模型：H = f²/(N·c) + f；近界限 = s(H − f)/(H + s − 2f)；远界限 = s(H − f)/(H − s)，s ≥ H 时无界。
calc.details.dof.symbols=f = 焦距，N = 光圈值，c = 弥散圆，s = 对焦距离，H = 超焦距。
calc.details.exposure.assumption=数值按输入值计算（f/5.6 即 N = 5.6）。不测量场景亮度。
calc.details.exposure.formula=EV = log2(N²/t)，N 为光圈值，t 为曝光时间（秒）。EV100 = EV − log2(ISO/100)。
calc.details.exposure.solved={0}自动求解：精确解 {1}，实际应用 {2}（{3}）。
calc.details.exposure.solvedExact={0}自动求解：{1}，未取标准档位。
calc.details.exposure.solvedLimit={0}自动求解：精确解 {1}；已达到参数边界，实际应用 {2}（{3}）。
calc.details.exposure.standard={0}：各项为通用标准档位，按曝光误差取最接近值，并按标称值计算（f/5.6 即 N = 5.6）。不测量场景亮度。
calc.details.exposure.target=目标 EV100 {0}，实际 {1}，偏差 {2}（实际 − 目标）。
calc.details.figure=人形高 {0} m，按比例绘制。
calc.details.fov.assumption=理想直线投影镜头，对焦于无穷远；忽略畸变与呼吸效应。
calc.details.fov.equivalent=35 mm 等效焦距：在 36 × 24 mm 画幅上对角线视角相同。结果按实际焦距计算。
calc.details.fov.formula=视角 = 2·atan(传感器尺寸 / (2 × 焦距))。覆盖范围 = 距离 × 传感器尺寸 / 焦距。
calc.details.motion.assumption=假设相机静止，主体以恒定速度横向运动。不含相机抖动、追拍和卷帘快门效应。
calc.details.motion.formula=传感器上的模糊 = 焦距 × 速度 × 时间 / 距离。像素 = 模糊 × 图像宽度 / 传感器宽度。
calc.details.motion.preview=预览仅示意模糊长度，并非模拟照片。
calc.details.nd.assumption=假设滤镜透光率理想；光圈与 ISO 不变。
calc.details.nd.formula=加 ND 后时间 = 原始时间 × 2^档数。倍数 = 2^档数 = 10^密度。
