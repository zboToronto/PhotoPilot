calc.assumption.coverage=画面覆盖范围 = 距离 x 传感器尺寸 / 焦距（即 2 x 距离 x tan(视角/2)），按理想针孔投影并从镜头起算。实际镜头在近距离对焦时取景会略有不同。
calc.assumption.motion=简化模型：相机静止，主体以恒定速度平行于传感器移动，主体距离远大于焦距。传感器上的模糊长度 = 焦距 x 速度 x 曝光时间 / 距离。不考虑相机抖动、追拍、旋转、果冻效应和防抖。
calc.assumption.motionNoPixels=未给出像素值：需要与该传感器宽度对应的图像宽度（像素）。仅凭像素总数无法确定。
calc.assumption.motionClose=主体距离小于 10 倍焦距，此近似会低估放大率，结果仅供粗略参考。
calc.assumption.motionStill=横向速度为零，本模型中没有主体运动模糊，运动不限制曝光时间上限（显示为无穷大）。
