discover.ready=“找点东西拍”已可用：核对地点、时间、限制和兴趣（手动输入、按名称查找，或经您明确允许后使用设备位置），以及已确认的器材和可选的拍摄历史；Gemini 提出活动建议，每条建议在排序前都会经过确定性检查：时间、直线距离、器材、光线和天气证据。建议可作为未确认草稿转入拍摄需求、保存到拍摄计划或忽略。获取建议无需先创建拍摄计划。
discover.cli.summaryHelp=F02 / discover：找点东西拍。AI 活动建议，并根据您的时间、距离、器材和已核实条件进行检查；可选择、保存或忽略。使用 discover help。
