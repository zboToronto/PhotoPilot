calc.assumption.battery=拍摄续航估算：ceil(计划张数 / 每块满电电池额定张数)。额定值应符合预期用法。温度、电池老化、屏幕、自动对焦和视频都会影响续航，未计入备用余量。仅凭 mAh 无法推算拍摄张数。
calc.assumption.exposure=EV = log2(N^2/t)。EV100 = EV - log2(ISO/100)；ISO 为 100 时二者相等。这不是曝光补偿或测光值。
calc.assumption.focusFormula=薄透镜理论近似：H=f^2/(N*c)+f；h0=H-f；近界限=s*h0/(h0+s-f)；远界限=s*h0/(h0-s+f)。s >= H 时远界限为无穷大。
calc.assumption.focusLimits=距离从镜头主平面起算。弥散圆由用户指定，并非传感器固有常数。忽略衍射、瞳孔放大率和呼吸效应，微距计算的精度有限。
calc.assumption.fov=直线投影镜头对焦于无穷远时：视角=2*atan(传感器尺寸/(2*f))。需要实际有效传感器尺寸，忽略裁切、畸变与呼吸效应。
calc.assumption.nd=调整后快门时间 = 原快门时间 x 2^档数。光圈与 ISO 不变，假设滤镜透光率理想。ND8 对应 3 档；OD 3.0 约为 9.966 档。
calc.assumption.storage=存储容量 = 拍摄张数 x 平均文件大小。十进制 MB=10^6 字节，GB=10^9 字节。存储卡数量向上取整，未计入文件系统开销、冗余或安全余量。可变压缩或视频需采用实测平均大小。
