cli.calc.exposureHelp=曝光：step=third|half|full 使用标准档位，step=exact 保留输入的数值；两者都输出报告（third 即 1/3 EV；只给出 solve 和 target 时也使用它）。solve=aperture|shutter|iso 配合 target=<EV100> 自动求解该设置（不要给出它的数值）。不带这些参数时按原方式输出精确结果。
cli.calc.gearHelp=可选参数 gear=<器材 UUID> 会复制已知相关规格，显式 key=value 参数将覆盖这些值。变焦焦距、拍摄光圈和弥散圆需自行选择。
cli.calc.gearValues=器材参数（提交命令即表示已检查；规格可能尚未核实）：{0} {1} {2}
cli.calc.hyperfocalFocus=对焦于超焦距时（即该距离处的景深）：近界限 {0} m，远界限 {1}。
cli.calc.optionalHelp=方括号 [ ] 中的参数为可选：fov 的 distance 会增加画面覆盖范围；motion 的 imageWidth 会增加以像素表示的模糊长度，blurLimit（像素，需要 imageWidth）会增加该模糊容许值内的最长曝光时间。
cli.calc.inputHelp=快门时间支持 1/125 或十进制秒数。ND 仅使用一种表示：ndStops、ndFactor（ND8 = 8 倍）、opticalDensity（OD 3.0）。全部输入为必填，单位见上方。
